// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 23
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// react-native-gradle-plugin 0.75 registers the OSSRH snapshots repository
// (oss.sonatype.org), which was decommissioned in June 2025 and now times
// out; the failing repository aborts every dependency resolution. Nightly
// RN builds are not used here, so drop it once all projects are configured.
gradle.projectsEvaluated {
    rootProject.allprojects { project ->
        project.repositories.removeAll(
            project.repositories.findAll { repo ->
                repo.hasProperty('url') && repo.url.toString().contains('oss.sonatype.org')
            }
        )
    }
}